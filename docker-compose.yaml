name: '${PROJECT_NAME:?must be set}'

networks:
  default:
    driver: bridge
  infra_services:
    external: true
    name: '${PROJECT_NAME:?must be set}-infra-services_default'
  infra_services_file_storage:
    external: true
    name: '${PROJECT_NAME:?must be set}-infra-services_file-storage'

secrets:
  AUTH_SECRET_ENCRYPTION_KEYS:
    environment: AUTH_SECRET_ENCRYPTION_KEYS
  FILE_STORAGE_S3_ACCESS_KEY_ID:
    environment: FILE_STORAGE_S3_ACCESS_KEY_ID
  FILE_STORAGE_S3_SECRET_ACCESS_KEY:
    environment: FILE_STORAGE_S3_SECRET_ACCESS_KEY
  MANAGEMENT_BACKEND_COOKIE_SESSION_KEYS:
    environment: MANAGEMENT_BACKEND_COOKIE_SESSION_KEYS
  MANAGEMENT_BACKEND_WS_IO_AUTH_KEY:
    environment: MANAGEMENT_BACKEND_WS_IO_AUTH_KEY
  MANAGEMENT_BACKEND_WS_IO_INTROSPECTION_TOKEN:
    environment: MANAGEMENT_BACKEND_WS_IO_INTROSPECTION_TOKEN
  MONGODB_URI:
    environment: MONGODB_URI
  REDIS_URL:
    environment: REDIS_URL

volumes:
  admin-frontend-static:

include:
  # Platform: request routing and host directory setup shared by the services
  - stacks/gateway/prod/compose.yaml
  - stacks/volume-permissions.compose.yaml

  # Services; add each new service's stack here
  - stacks/admin-frontend.compose.yaml
  - stacks/management-backend.compose.yaml
  - stacks/ops-workers-ts.compose.yaml
  - stacks/ws.io-server.compose.yaml
