name: '${PROJECT_NAME:?must be set}'

networks:
  default:
    driver: bridge
  infra_services:
    external: true
    name: '${PROJECT_NAME:?must be set}-infra-services_default'

secrets:
  MONGODB_URI:
    environment: MONGODB_URI
  REDIS_URL:
    environment: REDIS_URL

volumes:
  admin-frontend-static:

include:
  # Platform: request routing and host directory setup shared by the services
  - stacks/gateway/prod/compose.yaml
  - stacks/volume-permissions.compose.yaml

  # Services; add each new service's stack here
  - stacks/admin-frontend.compose.yaml
  - stacks/management-backend.compose.yaml
  - stacks/ops-workers-ts.compose.yaml
