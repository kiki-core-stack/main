x-common-build-args: &common-build-args
  NPM_CONFIG_REGISTRY: '${NPM_CONFIG_REGISTRY:?must be set}'
  PNPM_CONFIG_REGISTRY: '${PNPM_CONFIG_REGISTRY:?must be set}'

x-common-environments: &common-environments
  # Mount point of FILE_STORAGE_LOCAL_BASE_PATH (host) in services using local file storage.
  FILE_STORAGE_LOCAL_BASE_PATH: /files
  NODE_ENV: production

services:
  common-service:
    build:
      args:
        <<: *common-build-args
    env_file:
      - ./.env.services
    environment:
      <<: *common-environments
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: 10m
    networks:
      - default
      - infra_services
    pull_policy: never
    restart: always

  common-frontend:
    build:
      args:
        <<: *common-build-args
    environment:
      <<: *common-environments
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    networks:
      - default
    pull_policy: never
    restart: always
