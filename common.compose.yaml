x-common-build-args: &common-build-args
  NPM_CONFIG_REGISTRY: '${NPM_CONFIG_REGISTRY:?must be set}'
  PNPM_CONFIG_REGISTRY: '${PNPM_CONFIG_REGISTRY:?must be set}'

x-common-environments: &common-environments
  # Also name the file storage buckets (<PROJECT_NAME>-<ENVIRONMENT>-public / -private).
  ENVIRONMENT: '${ENVIRONMENT:?must be set}'
  FILE_STORAGE_S3_ENDPOINT: '${FILE_STORAGE_S3_ENDPOINT:?must be set}'
  FILE_STORAGE_S3_REGION: '${FILE_STORAGE_S3_REGION:-}'
  NODE_ENV: production
  PROJECT_NAME: '${PROJECT_NAME:?must be set}'
  WS_IO_SERVER_BASE_URL: ws://ws-io-server:8080

services:
  common-service:
    build:
      args:
        <<: *common-build-args
      # Private git dependencies are fetched through the SSH agent started by docker-build-and-run.sh.
      ssh:
        - default
    environment:
      <<: *common-environments
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: 10m
    networks:
      - default
      - infra_services
    pull_policy: never
    restart: always

  common-frontend:
    build:
      args:
        <<: *common-build-args
      ssh:
        - default
    environment:
      <<: *common-environments
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    networks:
      - default
    pull_policy: never
    restart: always
