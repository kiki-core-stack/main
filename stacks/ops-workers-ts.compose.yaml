services:
  ops-workers-ts:
    extends:
      file: ../common.compose.yaml
      service: common-service
    build:
      context: ../repos/ops-workers-ts
    container_name: '${PROJECT_NAME:?must be set}-ops-workers-ts'
    depends_on:
      management-backend:
        condition: service_healthy
      volume-permissions:
        condition: service_completed_successfully
    environment:
      EMAIL_SEND_JOB_WORKER_CONCURRENCY: '${EMAIL_SEND_JOB_WORKER_CONCURRENCY:?must be set}'
      SMS_SEND_JOB_WORKER_CONCURRENCY: '${SMS_SEND_JOB_WORKER_CONCURRENCY:?must be set}'
    image: '${DOCKER_REGISTRY_HOST:+${DOCKER_REGISTRY_HOST}/}${PROJECT_NAME:?must be set}/ops-workers-ts'
    secrets:
      - MONGODB_URI
      - REDIS_URL
      - source: OPS_WORKERS_TS_WS_IO_AUTH_KEY
        target: WS_IO_AUTH_KEY
    volumes:
      - '${LOGS_ROOT_PATH:?must be set}/ops-workers-ts:/logs'
