services:
  # Gives the service user (10001:nogroup in the service images) ownership of the host directories and volumes mounted
  # into the services before they start; only entries not yet owned by it are changed, so restarts stay fast on large
  # storage.
  volume-permissions:
    command:
      - -c
      - |
        # One log directory per service mounting LOGS_ROOT_PATH/<service> at /logs; add new services here.
        mkdir -p \
          /files \
          /logs/management-backend \
          /logs/ops-workers-ts \
          /volumes

        find /files /logs /volumes \( \! -user 10001 -o \! -group 65534 \) -exec chown 10001:65534 {} +
    container_name: '${PROJECT_NAME:?must be set}-volume-permissions'
    entrypoint:
      - /bin/sh
      - -eu
    image: 'alpine:latest'
    network_mode: none
    restart: no
    user: root
    volumes:
      - '${FILE_STORAGE_LOCAL_BASE_PATH:?must be set}:/files'
      - '${LOGS_ROOT_PATH:?must be set}:/logs'
      # Named volumes written by the service user, each at /volumes/<volume>.
