# Local file storage (FILE_STORAGE_LOCAL_BASE_PATH, mounted at /srv/files).
# private/ is only served through the APIs; names merely starting with it (e.g. /files/privates) stay public.
location = /files/private {
    return 404;
}

location ^~ /files/private/ {
    return 404;
}

location ^~ /files/ {
    alias /srv/files/;
    expires -1;
}
