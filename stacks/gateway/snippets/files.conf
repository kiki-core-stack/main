# Public files: the public bucket of the file storage ($file_storage_public_bucket_url, set by templates/file-storage.conf),
# served at their keys (/files/<hash>.<ext>).
location ^~ /files/ {
    limit_except GET {
        deny all;
    }

    # With a variable, nginx resolves the host per request through the http block's resolver; an IP needs none.
    proxy_pass $file_storage_public_bucket_url$uri;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_ssl_server_name on;
    proxy_hide_header Set-Cookie;

    # Keys are content hashes and never overwritten.
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable";

    # Without anonymous listing, S3 answers a missing key with 403.
    proxy_intercept_errors on;
    error_page 403 404 =404 @files-not-found;
}

location @files-not-found {
    return 404;
}
