services:
  gateway:
    extends:
      file: ../common.compose.yaml
      service: common-gateway
    container_name: '${PROJECT_NAME:?must be set}-gateway'
    depends_on:
      # Frontends exit after copying their static files into the shared volumes.
      admin-frontend:
        condition: service_completed_successfully
      management-backend:
        condition: service_started
      ws-io-server:
        condition: service_started
    environment:
      # Server names
      ADMIN_FRONTEND_SERVER_NAME: '${ADMIN_FRONTEND_SERVER_NAME:?must be set}'

      # Files; infra_services_file_storage reaches the RustFS of infra-services, other endpoints are reached directly.
      FILE_STORAGE_PUBLIC_BUCKET_URL: '${FILE_STORAGE_S3_ENDPOINT:?must be set}/${PROJECT_NAME:?must be set}-${ENVIRONMENT:?must be set}-public'

      # Substitute only server names and URLs so nginx variables in templates stay untouched.
      NGINX_ENVSUBST_FILTER: _(SERVER_NAME|URL)$$
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/sites
    networks:
      - default
      - infra_services_file_storage
    ports:
      - '127.0.0.1:${GATEWAY_EXPOSE_PORT:?must be set}:80'
    restart: always
    # The entrypoint only renders templates into an existing writable directory.
    tmpfs:
      - /etc/nginx/sites
    volumes:
      - '../nginx.conf:/etc/nginx/nginx.conf:ro'
      - '../snippets:/etc/nginx/snippets:ro'
      - './http.d:/etc/nginx/http.d:ro'
      - './templates:/etc/nginx/templates:ro'
      - 'admin-frontend-static:/srv/admin-frontend:ro'
