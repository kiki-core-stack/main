# Routes requests to the dev servers running on the host; see docs/main.md.
name: '${PROJECT_NAME:?must be set}-dev'

services:
  gateway:
    extends:
      file: ../common.compose.yaml
      service: common-gateway
    container_name: '${PROJECT_NAME:?must be set}-dev-gateway'
    environment:
      # Gateway
      GATEWAY_EXPOSE_PORT: '${GATEWAY_EXPOSE_PORT:?must be set}'

      # Services; ports of the dev servers on the host, the same as in each repo's env.

      # Admin frontend
      ADMIN_FRONTEND_PORT: '${ADMIN_FRONTEND_PORT:?must be set}'
      ADMIN_FRONTEND_SERVER_NAME: '${ADMIN_FRONTEND_SERVER_NAME:?must be set}'

      # Management backend
      MANAGEMENT_BACKEND_PORT: '${MANAGEMENT_BACKEND_PORT:?must be set}'

      # Substitute only ports and server names so nginx variables in templates stay untouched.
      NGINX_ENVSUBST_FILTER: _(PORT|SERVER_NAME)$$
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/sites
    # Dev servers listen on the host loopback, which a bridge network cannot reach.
    network_mode: host
    restart: unless-stopped
    # The entrypoint only renders templates into an existing writable directory.
    tmpfs:
      - /etc/nginx/sites
    volumes:
      - '${FILE_STORAGE_LOCAL_BASE_PATH:?must be set}:/srv/files:ro'
      - '../nginx.conf:/etc/nginx/nginx.conf:ro'
      - '../snippets:/etc/nginx/snippets:ro'
      - './templates:/etc/nginx/templates:ro'
