# TLS termination and compression belong to the upstream proxy; this gateway only routes requests.
error_log stderr notice;
pid /run/nginx.pid;
user nginx;
worker_processes 2;
worker_rlimit_nofile 8192;

events {
    worker_connections 4096;
}

http {
    # Base settings
    charset utf-8;
    # The upstream proxy enforces the request body limit.
    client_max_body_size 0;
    default_type application/octet-stream;
    include mime.types;
    sendfile on;
    server_tokens off;
    tcp_nopush on;

    # DNS; Docker embedded resolver lets upstreams follow container restarts.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 2s;

    # Log; the upstream proxy already records every request with the client IP.
    access_log off;

    # Maps
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }

    # TLS terminates upstream, so keep the original scheme instead of $scheme.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        '' $scheme;
    }

    # Upstreams
    include /etc/nginx/upstreams/*.conf;

    # Servers
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    # Rendered from templates/ by the image entrypoint.
    include /etc/nginx/sites/*.conf;
}
