services:
  management-backend:
    extends:
      file: ../common.compose.yaml
      service: common-service
    build:
      context: ../repos/management-backend
    container_name: '${PROJECT_NAME:?must be set}-management-backend'
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
    environment:
      ADMIN_AUTH_ORIGIN: 'https://${ADMIN_FRONTEND_SERVER_NAME:?must be set}'
    # The workers start listening only after the system initialization, so any response means it has finished.
    healthcheck:
      interval: 30s
      retries: 3
      start_interval: 1s
      start_period: 120s
      test:
        - CMD
        - bun
        - -e
        - await fetch('http://127.0.0.1:8080/')
      timeout: 5s
    image: '${DOCKER_REGISTRY_HOST:+${DOCKER_REGISTRY_HOST}/}${PROJECT_NAME:?must be set}/management-backend'
    secrets:
      - AUTH_SECRET_ENCRYPTION_KEYS
      - MONGODB_URI
      - REDIS_URL
      - source: MANAGEMENT_BACKEND_WS_IO_AUTH_KEY
        target: WS_IO_AUTH_KEY
      - source: MANAGEMENT_BACKEND_WS_IO_INTROSPECTION_TOKEN
        target: WS_IO_INTROSPECTION_TOKEN
    volumes:
      - '${FILE_STORAGE_LOCAL_BASE_PATH:?must be set}:/files'
      - '${LOGS_ROOT_PATH:?must be set}/management-backend:/logs'
