services:
  management-backend:
    extends:
      file: ../common.compose.yaml
      service: common-service
    build:
      context: ../repos/management-backend
    container_name: '${PROJECT_NAME:?must be set}-management-backend'
    image: '${DOCKER_REGISTRY_HOST:+${DOCKER_REGISTRY_HOST}/}${PROJECT_NAME:?must be set}/management-backend'
    secrets:
      - MONGODB_URI
      - REDIS_URL
    volumes:
      - '${FILE_STORAGE_LOCAL_BASE_PATH:?must be set}:/files'
